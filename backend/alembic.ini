# =========================================================
#  Configuración de Alembic para SivIA
#  La URL de conexión NO se escribe aquí: env.py la toma de la variable de
#  entorno DATABASE_URL, para no duplicar credenciales fuera de .env.
# =========================================================
[alembic]
script_location = migrations
prepend_sys_path = .

# Nombre de archivo de las revisiones: fecha + slug, para que el orden
# cronológico sea evidente al listar el directorio.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
