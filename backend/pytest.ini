[pytest]
# Sin esto, pytest solo añade tests/ al sys.path y no encuentra main ni models,
# que están en la raíz de la aplicación.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short --strict-markers
# La imagen corre como appuser y /app no es escribible: la caché va a /tmp.
cache_dir = /tmp/pytest_cache
